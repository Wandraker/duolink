<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Duolink</title>
<style>
:root{
  --bg:#12151C; --raise:#1A1F29; --sunk:#0E1117; --line:#273041; --line-soft:#1F2633;
  --text:#E9EDF5; --dim:#8C96AA; --faint:#5C667A;
  --c-cable:#5B8CFF; --c-phone:#FFB547; --c-wifi:#4FD1A5; --c-other:#D18CFF;
  --ok:#4FD1A5; --bad:#FF6B6B; --accent:#5B8CFF; --on-accent:#fff;
  --display:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --ui:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --r-s:6px; --r-m:10px;
}
@media (prefers-color-scheme: light){:root{
  --bg:#EEF1F6; --raise:#FFFFFF; --sunk:#E4E8EF; --line:#D3D9E3; --line-soft:#E2E6ED;
  --text:#1B202B; --dim:#5D6678; --faint:#8F98A9;
  --c-cable:#2F6BF0; --c-phone:#E08A00; --c-wifi:#14A37A; --c-other:#9B4FD6;
  --ok:#14A37A; --bad:#D63B3B; --accent:#2F6BF0;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--ui);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font:600 17px var(--display);letter-spacing:.1px}
.brand svg{width:26px;height:26px;display:block}
.sp{flex:1}
.merge{display:flex;align-items:center;gap:10px;color:var(--dim);cursor:pointer;user-select:none;
  padding:6px 6px 6px 12px;border-radius:999px;border:1px solid var(--line)}
.merge b{color:var(--text);font-weight:600}
.lang{background:none;border:0;color:var(--dim);cursor:pointer;padding:6px 8px;border-radius:6px}
.lang:hover{color:var(--text)}

/* switch */
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:transform .2s cubic-bezier(.3,.7,.4,1)}
.sw input:checked + i{background:var(--accent)}
.sw input:checked + i::after{transform:translateX(16px)}
.sw input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}

/* hero: the braid */
.hero{display:grid;grid-template-columns:minmax(130px,auto) 1fr 240px;align-items:stretch;min-height:300px;margin-top:6px}
.srcs{display:flex;flex-direction:column;justify-content:center;gap:26px;padding:18px 18px 18px 0;position:relative;z-index:1}
.src{display:flex;flex-direction:column;gap:1px}
.src .nm{font:600 15px var(--display);display:flex;align-items:center;gap:8px}
.src .nm::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--col)}
.src .v{color:var(--dim);font-size:13px;padding-left:16px}
.src .v b{color:var(--text);font-weight:600}
.src{position:relative}
.src .nm .l{display:inline-block}
/* a link joining: letters rise in one by one, a blue wave sweeps over it */
.src.enter .nm .l{animation:dl-letter .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*38ms)}
@keyframes dl-letter{
  0%{opacity:0;transform:translateY(7px);filter:blur(5px);color:#8FB0FF;text-shadow:0 0 12px rgba(91,140,255,.9)}
  60%{opacity:1;color:#B9CCFF;text-shadow:0 0 10px rgba(91,140,255,.55)}
  100%{opacity:1;transform:none;filter:none;color:inherit;text-shadow:none}}
.src.enter .nm::before{animation:dl-dot .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes dl-dot{from{transform:scale(0)}to{transform:scale(1)}}
.src.enter .v{animation:dl-reveal .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:.28s}
@keyframes dl-reveal{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.src.enter::after{content:"";position:absolute;inset:-6px -12px;border-radius:8px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(91,140,255,.22) 42%,rgba(150,182,255,.5) 50%,transparent 58%);
  background-size:260% 100%;animation:dl-wave 1.05s ease-out both}
@keyframes dl-wave{from{background-position:120% 0;opacity:1}to{background-position:-40% 0;opacity:0}}
.src.off .nm{color:var(--faint)}
.src.off .nm::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}
.braid{position:relative;min-width:0}
.braid canvas{position:absolute;inset:0;width:100%;height:100%}
.sum{display:flex;flex-direction:column;justify-content:center;padding-left:26px}
.sum .n{font:600 76px/0.9 var(--display);letter-spacing:-2.5px}
.sum .u{font:500 16px var(--display);color:var(--dim);margin-top:8px}
.sum .how{margin-top:18px;display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--dim)}
.sum .how span{display:flex;align-items:center;gap:8px}
.sum .how i{display:inline-block;width:14px;height:4px;border-radius:2px;background:var(--col)}
.sum .how b{color:var(--text);font-weight:600;margin-left:auto;padding-left:12px}
.note{color:var(--dim);font-size:13px;margin:4px 0 0;min-height:20px}

/* tabs */
.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px 12px;color:var(--dim);cursor:pointer;position:relative;font-weight:500}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.tab .cnt{color:var(--faint);margin-left:6px;font-weight:400}
.panel{padding:22px 0 48px}
.panel[hidden]{display:none}

/* downloads */
.add{display:flex;gap:10px}
.add input{flex:1;min-width:0;height:46px;padding:0 16px;border-radius:var(--r-m);border:1px solid var(--line);
  background:var(--raise);font-size:15px}
.add input::placeholder{color:var(--faint)}
.add input:focus{outline:none;border-color:var(--accent)}
.btn{height:46px;padding:0 22px;border-radius:var(--r-m);border:0;background:var(--accent);color:var(--on-accent);
  font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.s{height:32px;padding:0 12px;background:none;border:1px solid var(--line);color:var(--dim);font-weight:500;border-radius:var(--r-s)}
.btn.s:hover{color:var(--text);border-color:var(--faint);filter:none}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:0}
.list{margin-top:18px;display:flex;flex-direction:column}
.dl{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:16px 0;border-top:1px solid var(--line-soft)}
.dl:first-child{border-top:0}
.dl .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dl .acts{display:flex;gap:6px;grid-row:span 2;align-self:center}
.dl .meta{color:var(--dim);font-size:13px;display:flex;gap:16px;flex-wrap:wrap}
.dl .meta .bad{color:var(--bad)}
.dl .meta .good{color:var(--ok)}
.prog{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);display:flex;overflow:hidden}
.prog i{height:100%;transition:width .5s}
.empty{color:var(--dim);padding:28px 0 8px;max-width:60ch}

/* channels */
.chs{display:flex;flex-direction:column}
.ch{display:grid;grid-template-columns:minmax(180px,1.4fr) repeat(4,minmax(80px,1fr)) auto;align-items:center;gap:16px;
  padding:16px 0;border-top:1px solid var(--line-soft)}
.ch:first-child{border-top:0}
.ch .nm{font:600 15px var(--display);display:flex;align-items:center;gap:10px}
.ch .nm::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--col);flex:none}
.ch .ds{color:var(--faint);font-size:12px;padding-left:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .k{color:var(--dim);font-size:12px}
.ch .k b{display:block;color:var(--text);font-size:15px;font-weight:600}
.ch.down .nm::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad)}
.ch.down .k b{color:var(--faint)}
.ch.off .nm{color:var(--faint)}
.ch.off .nm::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}

/* TUN */
.tunbox{display:flex;gap:24px;align-items:flex-start;padding:20px 22px;border-radius:var(--r-m);
  background:var(--raise);border:1px solid var(--line);margin-bottom:30px}
.tunbox .tx{flex:1}
.tunbox h3{font:600 17px var(--display);margin:0 0 6px}
.tunbox p{color:var(--dim);margin:0;max-width:66ch}
.tunbox .st{margin-top:10px;font-size:13px;color:var(--dim)}
.tunbox .st.on{color:var(--ok)}
.tunbox .st.bad{color:var(--bad)}
.tunbox.on{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.badge{font-size:12px;font-weight:600;color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 50%,transparent);
  border-radius:999px;padding:2px 9px}
.sub{font:600 13px var(--ui);color:var(--dim);margin:0 0 14px}

/* proxy + settings */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.blk h3{font:600 16px var(--display);margin:0 0 8px}
.blk p{color:var(--dim);margin:0 0 14px;max-width:62ch}
.addr{display:flex;gap:8px;align-items:center}
.addr code{font:600 15px var(--ui);padding:10px 14px;border-radius:var(--r-s);background:var(--raise);border:1px solid var(--line)}
ol.steps{margin:0;padding-left:20px;color:var(--dim)}
ol.steps li{margin:6px 0}
ol.steps b{color:var(--text);font-weight:600}
.row{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line-soft)}
.row:first-of-type{border-top:0}
.row .tx{flex:1}
.row .tx div{font-weight:600}
.row .tx small{color:var(--dim);font-size:13px}
.foot{color:var(--faint);font-size:12px;margin-top:22px}
.foot a{color:var(--dim)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;min-height:0}
  .srcs{flex-direction:row;flex-wrap:wrap;gap:12px 24px;padding:8px 0}
  .braid{height:150px}
  .sum{padding:8px 0 0}
  .sum .n{font-size:56px}
  .ch{grid-template-columns:1fr 1fr auto}
  .ch .k.opt{display:none}
  .cols{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" fill="#1A1F29"/>
        <path d="M5 7.2c5 0 5.6 5.8 10.4 5.8" stroke="#5B8CFF" stroke-width="2.7" fill="none" stroke-linecap="round"/>
        <path d="M5 18.8c5 0 5.6-5.8 10.4-5.8" stroke="#FFB547" stroke-width="2.7" fill="none" stroke-linecap="round"/>
        <path d="M15.4 13H21" stroke="#F2F5FA" stroke-width="3.6" stroke-linecap="round"/></svg>
      Duolink
    </div>
    <span class="badge" id="tunBadge" hidden></span>
    <div class="sp"></div>
    <label class="merge" title="">
      <span data-t="mergeLbl"></span><b id="mergeState"></b>
      <span class="sw"><input type="checkbox" id="merge"><i></i></span>
    </label>
    <button class="lang" id="lang" type="button"></button>
  </header>

  <section class="hero" aria-label="">
    <div class="srcs" id="srcs"></div>
    <div class="braid"><canvas id="cv"></canvas></div>
    <div class="sum">
      <div class="n" id="total">0</div>
      <div class="u" data-t="unitNow"></div>
      <div class="how" id="how"></div>
    </div>
  </section>
  <p class="note" id="note"></p>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="dls" aria-selected="true"><span data-t="tabDl"></span><span class="cnt" id="cntDl"></span></button>
    <button class="tab" role="tab" data-tab="chs" aria-selected="false"><span data-t="tabCh"></span><span class="cnt" id="cntCh"></span></button>
    <button class="tab" role="tab" data-tab="prx" aria-selected="false"><span data-t="tabPx"></span></button>
    <button class="tab" role="tab" data-tab="set" aria-selected="false"><span data-t="tabSet"></span></button>
  </nav>

  <section class="panel" id="p-dls">
    <form class="add" id="addForm">
      <input id="url" type="url" required autocomplete="off" spellcheck="false">
      <button class="btn" type="submit" data-t="download"></button>
    </form>
    <div class="err" id="addErr"></div>
    <div class="list" id="dls"></div>
  </section>

  <section class="panel" id="p-chs" hidden><div class="chs" id="chs"></div></section>

  <section class="panel" id="p-prx" hidden>
    <div class="tunbox" id="tunBox">
      <div class="tx">
        <h3 data-t="tunT"></h3>
        <p data-t="tunP"></p>
        <div class="st" id="tunState"></div>
      </div>
      <span class="sw"><input type="checkbox" id="tun" aria-label=""><i></i></span>
    </div>
    <p class="sub" data-t="pxOr"></p>
    <div class="cols">
      <div class="blk">
        <h3 data-t="pxTitle"></h3>
        <p data-t="pxText"></p>
        <div class="addr"><code id="socks"></code><button class="btn s" id="copy" type="button" data-t="copy"></button></div>
        <p style="margin-top:14px" data-t="pxSticky"></p>
      </div>
      <div class="blk">
        <h3 data-t="qbTitle"></h3>
        <ol class="steps" id="qbSteps"></ol>
      </div>
    </div>
  </section>

  <section class="panel" id="p-set" hidden>
    <div class="blk" style="max-width:720px">
      <div class="row" id="rowAuto">
        <div class="tx"><div data-t="autoT"></div><small data-t="autoS"></small></div>
        <span class="sw"><input type="checkbox" id="auto"><i></i></span>
      </div>
      <div class="row">
        <div class="tx"><div data-t="dirT"></div><small id="dir"></small></div>
        <button class="btn s" id="openDir" type="button" data-t="open"></button>
      </div>
      <div class="row">
        <div class="tx"><div data-t="limT"></div><small data-t="limS"></small></div>
      </div>
    </div>
    <div class="foot">Duolink <span id="ver"></span>. GPL-3.0. <a href="https://github.com/Wandraker/duolink" target="_blank" rel="noopener">GitHub</a></div>
  </section>
</div>

const t=k=>T[lang][k]??k;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mbit=b=>b*8/1e6;
const fmtM=b=>{const v=mbit(b);return v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(1)};
const fmtB=b=>b>=1e9?(b/1e9).toFixed(2)+" "+t("gb"):b>=1e6?(b/1e6).toFixed(1)+" "+t("mb"):Math.max(0,b/1e3).toFixed(0)+" "+t("kb");
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

function applyLang(){
  document.documentElement.lang=lang;
  $("lang").textContent=lang==="ru"?"EN":"RU";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("url").placeholder=t("urlPh");
  $("qbSteps").innerHTML=t("qb").map(s=>`<li>${s}</li>`).join("");
}
$("lang").onclick=()=>{lang=lang==="ru"?"en":"ru";try{localStorage.setItem("duolink.lang",lang)}catch(e){};applyLang();render(true)};

// tabs
let tab=(()=>{try{return localStorage.getItem("duolink.tab")}catch(e){return null}})()||"dls";
function showTab(n){tab=n;document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===n));
  for(const p of ["dls","chs","prx","set"])$("p-"+p).hidden=p!==n;try{localStorage.setItem("duolink.tab",n)}catch(e){}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
showTab(tab);

// channel identity: stable colour + friendly name
const KCOL={cable:"--c-cable",phone:"--c-phone",wifi:"--c-wifi",other:"--c-other"};
const ORDER=["--c-cable","--c-phone","--c-wifi","--c-other"];
const colOf={};
function colorFor(c){
  if(colOf[c.name])return colOf[c.name];
  const used=new Set(Object.values(colOf));
  let v=KCOL[c.kind]||"--c-other";
  if(used.has(v))v=ORDER.find(o=>!used.has(o))||v;
  return colOf[c.name]=v;
}
function labels(chs){
  const by={};chs.forEach(c=>(by[c.kind]=by[c.kind]||[]).push(c));
  const out={};
  for(const k in by)by[k].forEach((c,i)=>out[c.name]=t(k)+(by[k].length>1?" "+(i+1):""));
  return out;
}

async function post(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
  if(!r.ok)throw new Error((await r.text()).trim()||r.statusText);return r.json()}

let S=null;const prevDone={},rate={};
// #demo shows made-up traffic on two links (for screenshots and design work).
const DEMO=location.hash==="#demo";
let demoT=0,demoDone=0;
function demoState(){
  demoT+=1;const w=(a,p)=>a*(1+0.18*Math.sin(demoT/p));
  const a=w(2.6e6,3.1),b=w(9.4e6,4.7);demoDone=Math.min(4.2e9,demoDone+a+b);
  return {version:"demo",socks:"127.0.0.1:1080",dir:"C:\\Users\\you\\Downloads\\Duolink",merge:true,autostart:true,app:true,
    channels:[{name:"Ethernet",kind:"cable",desc:"Realtek Gaming GbE Family Controller",enabled:true,up:true,rtt_ms:17,rx_rate:a,tx_rate:a/20,capacity:3e6,rx_total:9.1e8,tx_total:4e7,active:9,v4:"192.168.1.52"},
              {name:"Ethernet 2",kind:"phone",desc:"Remote NDIS based Internet Sharing Device",enabled:true,up:true,rtt_ms:41,rx_rate:b,tx_rate:b/20,capacity:1.1e7,rx_total:2.4e9,tx_total:9e7,active:14,v4:"10.181.196.197"}],
    downloads:[{id:"2",url:"https://example.com/game-repack.zip",path:"C:\\Downloads\\Duolink\\game-repack.zip",size:4.2e9,ranged:true,state:"running",done:demoDone,per_channel:{"Ethernet":demoDone*0.22,"Ethernet 2":demoDone*0.78}},
               {id:"1",url:"https://example.com/ubuntu-24.04.iso",path:"C:\\Downloads\\Duolink\\ubuntu-24.04.iso",size:6.1e9,ranged:true,state:"done",done:6.1e9,per_channel:{"Ethernet":1.5e9,"Ethernet 2":4.6e9}}]};
}
async function tick(){
  if(DEMO){S=demoState();render(false);return}
  try{const r=await fetch("/api/state",{cache:"no-store"});S=await r.json()}catch(e){return}
  render(false);
}

let lastKey="",prevFlow=new Set(),tunMsg="";
function render(force){
  if(!S)return;
  const chs=S.channels||[];
  const L=labels(chs);
  const usable=chs.filter(c=>c.up&&c.enabled);
  // header
  $("merge").checked=!!S.merge;
  $("mergeState").textContent=t(S.merge?"on":"off");
  $("ver").textContent=S.version;
  $("socks").textContent="127.0.0.1:"+(S.socks||"").split(":").pop();
  $("dir").textContent=S.dir;
  $("auto").checked=!!S.autostart;
  const tn=S.tun||{};
  $("tun").checked=!!tn.on;
  $("tun").disabled=!S.tun_available;
  $("tunBox").classList.toggle("on",!!tn.on);
  $("tunBadge").hidden=!tn.on;$("tunBadge").textContent=t("tunBadge");
  if(!tunMsg){const st=$("tunState");
    st.className="st"+(tn.error?" bad":tn.on?" on":"");
    st.textContent=tn.error?tn.error:t(tn.on?"tunOn":"tunOff")}
  $("rowAuto").hidden=!S.app;
  $("cntCh").textContent=chs.length||"";
  const active=(S.downloads||[]).filter(d=>d.state==="running"||d.state==="queued").length;
  $("cntDl").textContent=active||"";

  // hero sources
  const total=usable.reduce((a,c)=>a+c.rx_rate,0);
  // A link "flows" when traffic may use it: all usable ones, or only the best
  // one while combining is off (the others wait in reserve).
  const flowSet=new Set((S.merge?usable:usable.slice().sort((a,b)=>b.capacity-a.capacity).slice(0,1)).map(c=>c.name));
  const key=chs.map(c=>c.name+flowSet.has(c.name)+c.up+c.enabled).join("|")+lang;
  if(force||key!==lastKey){
    $("srcs").innerHTML=chs.map(c=>{
      const on=flowSet.has(c.name),enter=on&&!prevFlow.has(c.name)&&!reduced;
      const letters=[...L[c.name]].map((ch,i)=>`<span class="l" style="--i:${i}">${ch===" "?"&nbsp;":esc(ch)}</span>`).join("");
      return `<div class="src${on?"":" off"}${enter?" enter":""}" data-n="${esc(c.name)}" style="--col:var(${colorFor(c)})">
        <div class="nm" aria-label="${esc(L[c.name])}"><span>${letters}</span></div><div class="v"></div></div>`}).join("");
    for(const c of chs)if(flowSet.has(c.name)&&!prevFlow.has(c.name))braid.reveal(c.name);
    lastKey=key;
  }
  prevFlow=flowSet;
  for(const el of $("srcs").children){
    const c=chs.find(x=>x.name===el.dataset.n);if(!c)continue;
    el.querySelector(".v").innerHTML=!c.enabled?t("disabled"):!c.up?t("down"):!flowSet.has(c.name)?t("reserve"):
      `<b>${fmtM(c.rx_rate)}</b> ${t("mbit")}`;
  }
  $("total").textContent=fmtM(total);
  $("how").innerHTML=total>1e4?usable.filter(c=>c.rx_rate>0).sort((a,b)=>b.rx_rate-a.rx_rate)
    .map(c=>`<span style="--col:var(${colorFor(c)})"><i></i>${esc(L[c.name])}<b>${Math.round(c.rx_rate/total*100)}%</b></span>`).join(""):"";
  $("note").textContent=!chs.length?t("noCh"):!S.merge?t("mergeOffNote"):usable.length===1?t("oneCh"):"";
  braid.set(chs,!!S.merge);

  // channels tab
  const sum=usable.reduce((a,c)=>a+c.rx_total,0)||1;
  $("chs").innerHTML=chs.length?chs.map(c=>{
    const st=!c.enabled?" off":!c.up?" down":"";
    return `<div class="ch${st}" style="--col:var(${colorFor(c)})">
      <div><div class="nm">${esc(L[c.name])}</div><div class="ds">${esc(c.desc||c.name)}${c.v4?", "+esc(c.v4):""}</div></div>
      <div class="k">${t("speed")}<b>${c.up&&c.enabled?fmtM(c.rx_rate)+" "+t("mbit"):"—"}</b></div>
      <div class="k">${t("ping")}<b>${c.up?Math.round(c.rtt_ms)+" "+t("ms"):t("down")}</b></div>
      <div class="k opt">${t("share")}<b>${c.enabled&&c.up?Math.round(c.rx_total/sum*100)+"%":"—"}</b></div>
      <div class="k opt">${t("got")}<b>${fmtB(c.rx_total)}</b></div>
      <span class="sw" title="${esc(L[c.name])}"><input type="checkbox" data-ch="${esc(c.name)}" ${c.enabled?"checked":""} aria-label="${esc(L[c.name])}"><i></i></span>
    </div>`}).join(""):`<div class="empty">${t("noCh")}</div>`;

  // downloads tab
  const dls=S.downloads||[];
  $("dls").innerHTML=dls.length?dls.map(d=>{
    const name=(d.path||d.url).split(/[\\/]/).pop()||d.url;
    const prev=prevDone[d.id];prevDone[d.id]=d.done;
    if(d.state==="running"&&prev!=null)rate[d.id]=0.6*(rate[d.id]||0)+0.4*Math.max(0,d.done-prev);
    const sp=d.state==="running"?rate[d.id]||0:0;
    const per=Object.entries(d.per_channel||{}).filter(([,v])=>v>0);
    const base=d.size>0?d.size:Math.max(1,d.done);
    const bar=per.map(([n,v])=>{const c=chs.find(x=>x.name===n);return `<i style="width:${v/base*100}%;background:var(${c?colorFor(c):"--faint"})"></i>`}).join("");
    const pct=d.size>0?Math.min(100,d.done/d.size*100):0;
    const eta=sp>0&&d.size>0?Math.max(0,(d.size-d.done)/sp):0;
    const meta=[`<span class="${d.state==="failed"?"bad":d.state==="done"?"good":""}">${t(d.state)}</span>`,
      d.size>0?`<span>${fmtB(d.done)} / ${fmtB(d.size)}${d.state==="running"?" ("+pct.toFixed(0)+"%)":""}</span>`:`<span>${fmtB(d.done)}</span>`];
    if(d.state==="running"&&sp>0)meta.push(`<span>${fmtM(sp)} ${t("mbit")}</span>`);
    if(eta>0&&d.state==="running"){const mi=lang==="ru"?"мин":"min",se=lang==="ru"?"с":"s";
      meta.push(`<span>${t("left")} ${eta>=60?Math.floor(eta/60)+" "+mi+" ":""}${Math.round(eta%60)} ${se}</span>`)}
    if(per.length>1&&d.done>0)meta.push(per.map(([n,v])=>`${esc(L[n]||n)} ${Math.round(v/per.reduce((a,[,x])=>a+x,0)*100)}%`).join(", "));
    const B=(a,l)=>`<button class="btn s" data-act="${a}" data-id="${d.id}">${t(l)}</button>`;
    const live=d.state==="running"||d.state==="queued"||d.state==="connecting";
    const acts=live?B("pause","pause")+B("remove","cancel"):d.state==="paused"?B("resume","resume")+B("remove","cancel"):
      d.state==="failed"?B("resume","retry")+B("remove","remove"):d.state==="done"?B("reveal","showFile")+B("remove","remove"):B("remove","remove");
    return `<div class="dl"><div class="t" title="${esc(d.url)}">${esc(name)}</div><div class="acts">${acts}</div>
      <div class="meta">${meta.join("")}${d.error?`<span class="bad">${esc(d.error)}</span>`:""}${!d.ranged&&d.state==="running"?`<span>${t("single")}</span>`:""}</div>
      <div class="prog">${bar}</div></div>`}).join(""):`<div class="empty">${t("emptyDl")}</div>`;
}

// events
$("merge").onchange=async e=>{try{await post("/api/merge",{on:e.target.checked})}catch(err){}tick()};
$("tun").onchange=async e=>{
  const on=e.target.checked,st=$("tunState");
  try{const r=await post("/api/tun",{on});
    if(r.result==="elevating"){tunMsg="elev";st.className="st";st.textContent=t("tunElev");return}
    tunMsg=""}
  catch(err){e.target.checked=!on;tunMsg="err";st.className="st bad";
    st.textContent=/not granted|cancel/i.test(err.message)?t("tunNo"):err.message;setTimeout(()=>tunMsg="",6000)}
  tick()};
$("auto").onchange=async e=>{try{await post("/api/autostart",{on:e.target.checked})}catch(err){e.target.checked=!e.target.checked}tick()};
$("openDir").onclick=()=>post("/api/open-folder").catch(()=>{});
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("socks").textContent);$("copy").textContent=t("copied");setTimeout(()=>$("copy").textContent=t("copy"),1500)}catch(e){}};
$("chs").onchange=async e=>{const n=e.target.dataset.ch;if(!n)return;try{await post(`/api/channels/${encodeURIComponent(n)}/enabled`,{on:e.target.checked})}catch(err){}tick()};
$("dls").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.act)await post(`/api/downloads/${b.dataset.id}/${b.dataset.act}`).catch(()=>{});tick()};
$("addForm").onsubmit=async e=>{e.preventDefault();$("addErr").textContent="";
  try{await post("/api/downloads",{url:$("url").value.trim()});$("url").value="";showTab("dls")}catch(err){$("addErr").textContent=err.message}tick()};

// ---------- the braid: channels flowing into one stream ----------
const braid=(()=>{
  const cv=$("cv"),g=cv.getContext("2d");
  let W=0,H=0,chs=[],merge=true,scale=2.5e6,last=0; // bytes/s that fills the trunk
  const st={}; // per channel animated width + particles
  function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
  addEventListener("resize",size);
  function startY(name,i,n){
    const el=document.querySelector(`.src[data-n="${CSS.escape(name)}"]`);
    if(el&&innerWidth>860){const a=el.getBoundingClientRect(),b=cv.getBoundingClientRect();return a.top+a.height*0.32-b.top}
    return H*(i+1)/(n+1);
  }
  function set(c,m){chs=c;merge=m}
  function bez(p0,p1,p2,p3,u){const v=1-u;return v*v*v*p0+3*v*v*u*p1+3*v*u*u*p2+u*u*u*p3}
  function frame(ts){
    if(!W)size();
    const dt=Math.min(0.25,last?(ts-last)/1000:0.016);last=ts;const k=1-Math.pow(0.02,dt);
    g.clearRect(0,0,W,H);
    const live=chs.filter(c=>c.up&&c.enabled);
    const flowing=merge?live:live.slice().sort((a,b)=>b.capacity-a.capacity).slice(0,1);
    const tot=flowing.reduce((a,c)=>a+c.rx_rate,0);
    scale=Math.max(scale*Math.pow(0.85,dt),tot*1.15,1.2e6);
    const Tmax=Math.max(40,Math.min(H*0.46,130)),mx=W*0.58,my=H/2;
    // target widths
    let trunkW=0;
    chs.forEach(c=>{const s=st[c.name]=st[c.name]||{w:0,parts:[],acc:0};
      const on=flowing.includes(c);
      const tw=on?Math.max(4,c.rx_rate/scale*Tmax):0;
      s.w+=(tw-s.w)*k;s.on=on;if(on)trunkW+=s.w});
    // trunk base
    let off=my-trunkW/2;
    chs.forEach((c,i)=>{
      const s=st[c.name],col=css(colorFor(c)),y0=startY(c.name,i,chs.length);
      if(!s.on||s.w<0.6){ // idle / off: thin dashed stub that fades before the merge
        g.save();g.setLineDash([3,6]);g.lineWidth=1.5;g.strokeStyle=css("--faint");g.globalAlpha=.7;
        g.beginPath();g.moveTo(0,y0);g.bezierCurveTo(W*0.18,y0,W*0.24,y0+(my-y0)*0.25,W*0.3,y0+(my-y0)*0.35);g.stroke();g.restore();
        s.parts.length=0;return;
      }
      const ye=off+s.w/2;off+=s.w;
      // A link that just joined is drawn in by a wave travelling from its
      // label into the trunk.
      const rp=s.rvAt?Math.min(1,(ts-s.rvAt)/1100):1,rx=(1-Math.pow(1-rp,3))*W;
      if(rp<1){g.save();g.beginPath();g.rect(0,0,rx,H);g.clip()}
      // Each link leaves its label as a thin wire and swells to its real
      // share of the trunk at the merge point.
      const w0=Math.min(s.w,6),wAt=u=>w0+(s.w-w0)*(u*u*(3-2*u));
      const N=36,top=[],bot=[];
      for(let i=0;i<=N;i++){const u=i/N,x=bez(0,W*0.3,W*0.4,mx,u),y=bez(y0,y0,ye,ye,u),h=wAt(u)/2;top.push([x,y-h]);bot.push([x,y+h])}
      g.save();g.fillStyle=col;g.globalAlpha=.30;g.beginPath();
      top.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));
      g.lineTo(W,ye-s.w/2);g.lineTo(W,ye+s.w/2);
      for(let i=N;i>=0;i--)g.lineTo(bot[i][0],bot[i][1]);
      g.closePath();g.fill();
      g.globalAlpha=.95;g.strokeStyle=col;g.lineWidth=2;g.lineCap="round";
      g.beginPath();g.moveTo(0,y0);g.bezierCurveTo(W*0.3,y0,W*0.4,ye,mx,ye);g.lineTo(W,ye);g.stroke();g.restore();
      s.wAt=wAt;
      // particles: density follows real throughput
      if(!reduced){
        s.acc+=Math.min(1.2,(c.rx_rate/scale*0.9+0.04)*dt*60);
        while(s.acc>=1){s.acc-=1;s.parts.push({u:0,o:(Math.random()-.5)*0.8,sp:0.0045+Math.random()*0.002})}
        g.fillStyle=col;
        s.parts=s.parts.filter(p=>p.u<1);
        for(const p of s.parts){
          p.u+=p.sp*dt*60;let x,y;
          let lw=s.w;
          if(p.u<0.6){const u=p.u/0.6;x=bez(0,W*0.3,W*0.4,mx,u);y=bez(y0,y0,ye,ye,u);lw=s.wAt(u)}
          else{x=mx+(W-mx)*((p.u-0.6)/0.4);y=ye}
          y+=p.o*lw*0.85;
          g.globalAlpha=Math.min(1,p.u*8,(1-p.u)*10);
          g.beginPath();g.arc(x,y,1.9,0,Math.PI*2);g.fill();
        }
        g.globalAlpha=1;
      }
      if(rp<1){
        g.restore();
        const yA=Math.min(y0,ye)-s.w/2-14,yB=Math.max(y0,ye)+s.w/2+14;
        const gr=g.createLinearGradient(rx-90,0,rx+4,0);
        gr.addColorStop(0,"rgba(91,140,255,0)");gr.addColorStop(0.85,"rgba(91,140,255,.32)");gr.addColorStop(1,"rgba(160,190,255,.85)");
        g.fillStyle=gr;g.globalAlpha=1-rp*0.6;g.fillRect(rx-90,yA,94,yB-yA);g.globalAlpha=1;
      }
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  function reveal(n){if(reduced)return;(st[n]=st[n]||{w:0,parts:[],acc:0}).rvAt=performance.now()}
  return {set,reveal};
})();

applyLang();tick();setInterval(tick,1000);
</script>
